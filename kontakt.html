<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style/navbar.css">
    <link rel="stylesheet" href="/style/kontakt.css">
    <link rel="stylesheet" href="/style/footer.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap" rel="stylesheet">
    <title>Kontakt</title>
    <script src="/js/js_index.js" defer></script>
    <script src="/js/js_kontakt.js" defer></script>
</head>

<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <a href="index.html">Katrin Stauffer</a>
            </div>
            <ul class="menu">
                <a href="index.html" class="header-link">Galerie</a>
                <a href="#" class="header-link is-active">Kontakt</a>
                <a href="home.html" class="header-link">Über mich</a>
            </ul>
            <button class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
        <div class="container-aside">
            <aside class="mobile-menu">
                <ul>
                    <a href="index.html" class="mobile-link">Galerie</a>
                    <a href="#" class="mobile-link is-active">Kontakt</a>
                    <a href="home.html" class="mobile-link">Über mich</a>
                </ul>
            </aside>
        </div>
    </nav>

    <div class="content">
        <div class="contact">
            <div class="heading">Kontakt</div>
            <a class="contact-mail" href="mailto:staufferkatrin@t-online.de">staufferkatrin@t-online.de</a>

            <form class="contact-form" id="contact-form">
                <label class="form-label" for="subject">Betreff</label>
                <input class="form-input" type="text" id="subject" name="subject" placeholder="Worum geht es?">

                <label class="form-label" for="message">Nachricht</label>
                <textarea class="form-input" id="message" name="message" rows="9" placeholder="Ihre Nachricht"></textarea>

                <button class="form-button" type="submit">E-Mail schreiben</button>
                <p class="form-hint">Der Button öffnet Ihr E-Mail-Programm mit der fertigen Nachricht.</p>
            </form>
        </div>
    </div>

    <footer class="footer">
        <p class="p--footer">
            <a class="a--p--footer" href="impressum.html">Impressum</a>
        </p>
        <p class="p--footer ">|</p>
        <p class="p--footer ">
            <a class="a--p--footer" href="datenschutzerklaerung.html">Datenschutzerklärung</a>
        </p>
    </footer>

</body>

</html>
